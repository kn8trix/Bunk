{% extends "base.html" %}
{% load static %}
{% block title %}Edit Profile - Bunk{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-8">

    <h1 class="text-2xl font-semibold text-base-1 mb-6">Edit Profile</h1>

    <form method="post" class="space-y-6">
        {% csrf_token %}

        <!-- Bio -->
        <div>
            <label class="block text-sm font-medium text-base-1 mb-2">Bio</label>
            <textarea name="bio" rows="4" class="w-full px-3 py-2 rounded-lg border border-border resize-none focus:ring-2 focus:ring-gold focus:border-gold placeholder-gray-300 text-sm outline-none"
                      placeholder="Tell us about yourself...">{{ profile.bio }}</textarea>
        </div>

        <!-- Skills -->
        <div>
            <label class="block text-sm font-medium text-base-1 mb-2">Skills (comma-separated)</label>
            <input type="text" name="skills" value="{{ profile.skills }}" class="w-full px-3 py-2 rounded-lg border border-border focus:ring-2 focus:ring-gold focus:border-gold placeholder-gray-300 text-sm outline-none"
                   placeholder="e.g. Python, Django, React, JavaScript">
        </div>

        <!-- Interests -->
        <div>
            <label class="block text-sm font-medium text-base-1 mb-2">Interests (comma-separated)</label>
            <input type="text" name="interests" value="{{ profile.interests }}" class="w-full px-3 py-2 rounded-lg border border-border focus:ring-2 focus:ring-gold focus:border-gold placeholder-gray-300 text-sm outline-none"
                   placeholder="e.g. Machine Learning, Web Development, Design">
        </div>

        <!-- Submit -->
        <div>
            <button type="submit" class="w-full px-4 py-2 bg-gold text-main rounded-lg hover:bg-gold/90 transition-colors font-medium">
                Update Profile
            </button>
        </div>
    </form>

</div>
{% endblock %}
